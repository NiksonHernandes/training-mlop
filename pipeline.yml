name: Train-Pipeline

on:
  push:
  pull_request:
    branches:
      - layers
      - feat/treinamento-com-anaconda
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook

jobs:
  test_train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f AmbientesConda/requirements.txt ]; then pip install -r AmbientesConda/requirements.txt; fi

      - name: Test files
        run: |
          python -m pytest test_train.py

  train_pipeline:
    runs-on: ubuntu-latest
    needs: [test_train]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f AmbientesConda/requirements.txt ]; then pip install -r AmbientesConda/requirements.txt; fi

      - name: Train Model
        run: |
          python train.py

  build_image:
    runs-on: ubuntu-latest
    needs: [train_pipeline]
    steps:
      - uses: actions/checkout@v3

      - name: Docker login
        run: |
          docker login -u ${{secrets.DOCKER_USER}} -p ${{secrets.DOCKER_PASSWORD}}

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ${{secrets.DOCKER_USER}}/${{secrets.DOCKER_IMAGE_NAME}}

      - name: Docker Push
        run: docker push ${{secrets.DOCKER_USER}}/${{secrets.DOCKER_IMAGE_NAME}}